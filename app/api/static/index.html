<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>용인대 학사·장학 챗봇</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans KR', 'Apple SD Gothic Neo', sans-serif;
      background: #eef4fb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .chat-container {
      width: 100%;
      max-width: 860px;
      height: 100vh;
      max-height: 820px;
      background: white;
      border-radius: 16px;
      border: 1.5px solid #c5daf5;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1.5px solid #c5daf5;
      background: white;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header img {
      width: 46px;
      height: 46px;
      object-fit: contain;
      border-radius: 50%;
      border: 1.5px solid #c5daf5;
      background: #eef4fb;
      padding: 3px;
    }

    .header-text h1 {
      font-size: 1.05rem;
      font-weight: 700;
      color: #1a1a2e;
    }

    .header-text p {
      font-size: 0.78rem;
      color: #6b7a99;
      margin-top: 2px;
    }

    .online-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #f0f7ff;
      border: 1.5px solid #c5daf5;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.85rem;
      color: #3a3a5c;
      font-weight: 500;
    }

    .online-dot {
      width: 8px;
      height: 8px;
      background: #4caf50;
      border-radius: 50%;
    }

    /* Chat area */
    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: white;
    }

    .msg {
      max-width: 68%;
      padding: 14px 18px;
      border-radius: 18px;
      line-height: 1.65;
      font-size: 0.93rem;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg.bot {
      background: #ddeeff;
      color: #1a2a4a;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .msg.user {
      background: #d9f5e5;
      color: #1a3a2a;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }

    .msg.typing {
      background: #eef4fb;
      color: #888;
      align-self: flex-start;
      font-style: italic;
      border-bottom-left-radius: 4px;
    }

    /* Input area */
    #input-area {
      display: flex;
      align-items: center;
      padding: 14px 20px;
      background: white;
      border-top: 1.5px solid #c5daf5;
      gap: 10px;
    }

    #user-input {
      flex: 1;
      padding: 12px 18px;
      border: 1.5px solid #c5daf5;
      border-radius: 24px;
      font-size: 0.93rem;
      outline: none;
      background: #f8fbff;
      color: #1a1a2e;
      transition: border-color 0.2s;
    }

    #user-input::placeholder { color: #aab; }

    #user-input:focus { border-color: #3b82f6; background: white; }

    #send-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #3b82f6;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    #send-btn:hover { background: #2563eb; }
    #send-btn:disabled { background: #aab; cursor: default; }

    #send-btn svg {
      width: 20px;
      height: 20px;
      fill: white;
    }
  </style>
</head>
<body>

<div class="chat-container">
  <!-- Header -->
  <header>
    <div class="header-left">
      <img src="/static/logo.png" alt="용인대 마스코트" />
      <div class="header-text">
        <h1>용인대 학사·장학 챗봇</h1>
        <p>학사 · 장학 · FAQ · 시간표</p>
      </div>
    </div>
    <div class="online-badge">
      <span class="online-dot"></span>
      Online
    </div>
  </header>

  <!-- Chat -->
  <div id="chat-box">
    <div class="msg bot">안녕하세요! 용인대 학사·장학 챗봇입니다.<br>원하는 질문을 입력해 주세요.</div>
  </div>

  <!-- Input -->
  <div id="input-area">
    <input id="user-input" type="text" placeholder="질문을 입력하세요..." autofocus />
    <button id="send-btn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/>
      </svg>
    </button>
  </div>
</div>

<script>
  const chatBox = document.getElementById('chat-box');
  const input   = document.getElementById('user-input');
  const btn     = document.getElementById('send-btn');
  const history = [];

  input.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

  function addMsg(text, role) {
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    div.textContent = text;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
    return div;
  }

  async function sendMessage() {
    const question = input.value.trim();
    if (!question) return;

    addMsg(question, 'user');
    history.push({ role: 'user', content: question });
    input.value = '';
    btn.disabled = true;

    const typing = addMsg('답변 생성 중...', 'typing');

    try {
      const res = await fetch('/YU_AI_CHATBOT/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question, history: history.slice(0, -1) }),
      });
      const data = await res.json();
      chatBox.removeChild(typing);
      addMsg(data.answer, 'bot');
      history.push({ role: 'assistant', content: data.answer });
      if (history.length > 12) history.splice(0, 2);
    } catch (e) {
      chatBox.removeChild(typing);
      addMsg('오류가 발생했습니다. 잠시 후 다시 시도해주세요.', 'bot');
    }

    btn.disabled = false;
    input.focus();
  }
</script>
</body>
</html>
